name: Version Update
description: Request a modpack or mod update
title: "Update [mod/modpack] to [version]"
labels: ["Version Update"]
assignees:
  - Speedymr01
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Please request a mod or modpack update below.

  - type: input
    id: version
    attributes:
      label: Version to update to
      description: Enter the version you want the mod/modpack updated to.
      placeholder: ex. 1.2.3
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Update
      description: Why do you need this update? (e.g. bug fix, new feature, compatibility)
      placeholder: |
        e.g., "Updating to fix a crash with another mod" or "Needed for new content"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add any extra information or context for this update request.
      placeholder: Optional details…
    validations:
      required: false
